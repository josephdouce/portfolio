<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joseph Douce · Portfolio</title>
  <meta name="description" content="Apps, tools and automation by Joseph Douce: Power Platform, Microsoft 365, home automation, marine engineering and more.">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Portfolio</p>
      <h1>Joseph Douce</h1>
      <p class="sub">BEng (Hons). I build the tools I wish existed: Power Platform business apps, Microsoft 365 utilities, ESPHome firmware and reverse-engineered device protocols. Started out writing software at sea.</p>
      <div class="links">
        <a class="btn" href="https://github.com/josephdouce" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
      <nav class="toc" id="toc" aria-label="Sections"></nav>
    </div>
  </header>

  <main class="wrap" id="sections"></main>

  <footer class="wrap foot">
    <p>© <span id="yr"></span> Joseph Douce · Built as a static page, hosted on GitHub Pages.</p>
  </footer>

  <template id="tpl-card">
    <article class="card">
      <div class="card-top">
        <h3></h3>
        <span class="year"></span>
      </div>
      <p class="note"></p>
      <p class="blurb"></p>
      <ul class="tags"></ul>
      <div class="actions"></div>
    </article>
  </template>

  <script src="projects.js"></script>
  <script>
    const repoUrl = r => !r ? null : r.startsWith("http") ? r : `https://github.com/${GITHUB_USER}/${r}`;
    const toc = document.getElementById("toc");
    const root = document.getElementById("sections");
    const tpl = document.getElementById("tpl-card");

    for (const cat of CATEGORIES) {
      const items = PROJECTS.filter(p => p.category === cat.id)
        .sort((a, b) => (b.featured === true) - (a.featured === true) || b.year - a.year);

      const a = document.createElement("a");
      a.href = `#${cat.id}`; a.textContent = cat.title;
      toc.appendChild(a);

      const sec = document.createElement("section");
      sec.id = cat.id;
      sec.innerHTML = `<div class="sec-head"><h2></h2><span class="count"></span></div><p class="intro"></p><div class="grid"></div>`;
      sec.querySelector("h2").textContent = cat.title;
      sec.querySelector(".intro").textContent = cat.intro;
      sec.querySelector(".count").textContent = items.length ? `${items.length} project${items.length > 1 ? "s" : ""}` : "";
      const grid = sec.querySelector(".grid");

      if (!items.length) {
        grid.innerHTML = `<div class="placeholder"><strong>Coming soon</strong><span>Work apps are being written up and will appear here shortly.</span></div>`;
      }

      for (const p of items) {
        const card = tpl.content.firstElementChild.cloneNode(true);
        if (p.featured) card.classList.add("featured");
        if (p.thumb) {
          const t = document.createElement("a"); t.className = "thumb"; t.href = p.details || p.live || repoUrl(p.repo) || "#";
          const im = document.createElement("img"); im.src = p.thumb; im.alt = `${p.name} screenshot`; im.loading = "lazy";
          t.appendChild(im); card.prepend(t);
        }
        card.querySelector("h3").textContent = p.name;
        card.querySelector(".year").textContent = p.year ?? "";
        const note = card.querySelector(".note");
        if (p.note) note.textContent = p.note; else note.remove();
        card.querySelector(".blurb").textContent = p.blurb;
        const tags = card.querySelector(".tags");
        (p.tags || []).forEach(t => { const li = document.createElement("li"); li.textContent = t; tags.appendChild(li); });
        const act = card.querySelector(".actions");
        const link = (href, label, cls) => { if (!href) return; const l = document.createElement("a"); l.href = href; l.target = "_blank"; l.rel = "noopener"; l.className = cls; l.textContent = label; act.appendChild(l); };
        if (p.details) { const d = document.createElement("a"); d.href = p.details; d.className = "primary"; d.textContent = "Details →"; act.appendChild(d); }
        link(p.live, "Open ↗", p.details ? "ghost" : "primary");
        link(repoUrl(p.repo), "Source", "ghost");
        if (!act.children.length) act.remove();
        grid.appendChild(card);
      }
      root.appendChild(sec);
    }
    document.getElementById("yr").textContent = new Date().getFullYear();
  </script>
</body>
</html>
